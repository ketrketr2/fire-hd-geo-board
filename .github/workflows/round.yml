name: round

# 週次ラウンド: AI6面計測 → 付帯収集 → 集計 → ビルド → playwright検証 → 暗号化 → 復号検証 → docs/公開 → コミット。
# 定常cronはテスト1周と予算確定後に有効化する（毎週月曜 07:10 JST = 日曜 22:10 UTC）。
on:
  workflow_dispatch:
    inputs:
      cap:
        description: "AI6面ラウンドの支払上限（USD）"
        default: "15"
      extra_cap:
        description: "付帯収集の支払上限（USD）"
        default: "6"
      skip_extra:
        description: "付帯収集をスキップする（true/false）"
        default: "false"
  # schedule:
  #   - cron: "10 22 * * 0"

permissions:
  contents: write

concurrency:
  group: kindle-geo
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 鍵の有無を確認
        env:
          L: ${{ secrets.DATAFORSEO_LOGIN }}
          P: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          if [ -z "$L" ] || [ -z "$P" ]; then
            echo "::error::Secrets未登録（DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD）"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (python)
        run: pip install -r requirements.txt

      - name: detect selftest（辞書の退行検知）
        run: python src/detect.py

      - name: AI6面 計測ラウンド
        env:
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GEO_BOARD_WORKERS: "8"
        run: python src/run_round.py --cap "${{ inputs.cap || '15' }}"

      - name: 付帯収集（Amazon / アプリ / YouTube / ニュース / 需要）
        if: ${{ inputs.skip_extra != 'true' }}
        continue-on-error: true
        env:
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python src/collect_extra.py --cap "${{ inputs.extra_cap || '6' }}"

      - name: Googleトレンド（pytrends・失敗しても続行）
        continue-on-error: true
        run: python tools/pull_trends.py

      - name: 集計 → tools/board_data.json
        run: python tools/aggregate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: ビルド → 検証（ERRORS none まで公開しない）
        env:
          PW_CHROME: ""
        run: |
          set -e
          python tools/build.py
          node tools/verify.js

      - name: 暗号化 → 復号検証 → 公開（KINDLE_GATE_KEY が未登録なら公開はスキップ）
        env:
          KINDLE_GATE_KEY: ${{ secrets.KINDLE_GATE_KEY }}
          PW_CHROME: ""
        run: |
          set -e
          if [ -z "$KINDLE_GATE_KEY" ]; then
            echo "::warning::KINDLE_GATE_KEY 未登録のため docs/index.html は更新しません（データのみコミット）"
            exit 0
          fi
          python tools/encrypt.py
          node tools/verify_gate.js
          mv index_new.html docs/index.html
          rm -f s_board.png s_gate_after.png plain.html

      - name: コミット
        if: ${{ always() }}
        run: |
          git config user.name  "kindle-geo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/snapshots data/raw data/trends.json tools/board_data.json docs/ || true
          git diff --staged --quiet || git commit -m "chore: round $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push
