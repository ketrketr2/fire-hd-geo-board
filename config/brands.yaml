# ブランド辞書（回答本文からの検出用）。照合は NFKC + casefold 正規化後に「長い順」で行う。
# aliases … ヒットさせる語 / guards … 先にマスクして誤検出を防ぐ語（他ブランドのaliasを壊さないよう最小限）
self:
  id: kindle
  label: "Kindle"
  aliases: ["kindle", "キンドル", "paperwhite", "ペーパーホワイト", "colorsoft", "カラーソフト", "kindle scribe", "スクライブ"]
  guards: []
  models:                       # 端末名の言及（モデル別の語られ量）
    kindle_basic: ["kindle（第", "kindle 第", "kindle 無印", "無印kindle", "無印 kindle", "エントリーモデル", "kindle 16gb", "ベーシックモデル"]
    paperwhite: ["paperwhite", "ペーパーホワイト"]
    colorsoft: ["colorsoft", "カラーソフト"]
    scribe: ["scribe", "スクライブ"]
    kids: ["キッズモデル", "kids"]
    unlimited: ["unlimited", "アンリミテッド", "読み放題"]
    app: ["kindleアプリ", "kindle アプリ", "kindle for", "アプリ版"]
tier1:
  - id: kobo
    label: "楽天Kobo"
    aliases: ["kobo", "コボ", "楽天kobo", "clara", "libra", "elipsa"]
    guards: []
  - id: boox
    label: "BOOX"
    aliases: ["boox", "onyx", "palma", "note air", "ブークス"]
    guards: []
  - id: ipad
    label: "iPad"
    aliases: ["ipad", "アイパッド"]
    guards: []
tier2:
  - id: remarkable
    label: "reMarkable"
    aliases: ["remarkable"]
    guards: []
  - id: bigme
    label: "Bigme"
    aliases: ["bigme", "hibreak"]
    guards: []
  - id: meebook
    label: "Meebook"
    aliases: ["meebook"]
    guards: []
  - id: pocketbook
    label: "PocketBook"
    aliases: ["pocketbook"]
    guards: []
  - id: supernote
    label: "Supernote"
    aliases: ["supernote"]
    guards: []
  - id: fire
    label: "Fireタブレット"
    aliases: ["fire hd", "fireタブレット", "fire タブレット", "fire max", "amazon fire"]
    guards: ["kindle fire"]
  - id: quaderno
    label: "QUADERNO"
    aliases: ["quaderno", "クアデルノ"]
    guards: []
  - id: sony
    label: "Sony Reader"
    aliases: ["sony reader", "prs-t", "prs-6"]
    guards: []
  - id: matepad
    label: "MatePad Paper"
    aliases: ["matepad paper"]
    guards: []

