# ============================================================
#  Fire TV GEOボード 設定（全閾値・面・予算はここで管理。コードは触らない）
# ============================================================
site:
  title: "Fire TV 語られ方ボード"
  brand: "Fire TV"
  owner: "Amazon Fire TV（テレビ用ストリーミング端末）国内販売（Amazon.co.jp）"
  market: "Japan"
  language: "ja"
  timezone: "Asia/Tokyo"
  gate_marker: "FIRETV_BOARD"

# ---- 計測するAI面（6面）----
# chatgpt/gemini/aio/aimode は御殿場・トヨタ案件で1,700呼以上検証済みの仕様。
# claude/perplexity は本案件で追加（モデル名は実行時に models エンドポイントで解決）。
surfaces:
  - id: chatgpt
    label: "ChatGPT"
    provider: dataforseo
    model: "gpt-5"
    enabled: true
    max_tokens: 4096          # gpt-5は推論モデル。小さいと推論だけで使い切る
    system_message: "最新の情報をウェブで確認したうえで、参照した出典を必ず示して日本語で回答してください。"
  - id: gemini
    label: "Gemini"
    provider: dataforseo
    model: "gemini-2.5-flash"
    enabled: true
    max_tokens: 2048
  - id: claude
    label: "Claude"
    provider: dataforseo
    model: "claude-sonnet-4-0"   # models エンドポイントに無ければ sonnet を含む最初のモデルへ
    enabled: true
    max_tokens: 2048
    system_message: "最新の情報をウェブで確認したうえで、参照した出典を必ず示して日本語で回答してください。"
  - id: perplexity
    label: "Perplexity"
    provider: dataforseo
    model: "sonar-pro"           # models エンドポイントに無ければ sonar を含む最初のモデルへ
    enabled: true
    max_tokens: 2048
  - id: aio
    label: "AI Overview"
    provider: serp               # organic + load_async_ai_overview
    enabled: true
  - id: aimode
    label: "AIモード"
    provider: serp               # serp/google/ai_mode
    enabled: true

serp:
  location_code: 2392            # Japan
  language_code: "ja"

amazon:
  location_code: 2392
  language_code: "ja_JP"
  se_domain: "amazon.co.jp"
  search_keywords: ["ストリーミングデバイス", "fire tv stick", "chromecast", "テレビ youtube", "メディアプレーヤー テレビ"]
  max_asin_lookups: 10

apps:
  apple_app_id: "1234595891"     # TVer（App Store 日本）※Fire TV本体はストア外のため、テレビ視聴の主要アプリで代替
  google_app_id: "com.amazon.avod.thirdpartyclient"   # Prime Video（Fire TVの主用途アプリ）

youtube_keywords: ["Fire TV Stick レビュー", "Fire TV Stick 4K Select", "テレビ YouTube 見る方法", "Google TV Streamer 比較", "Fire TV Stick 設定"]
news_keywords: ["Fire TV Stick", "Fire TV", "ストリーミングデバイス 新製品"]
content_keywords: ["fire tv stick", "fire tv", "ファイヤースティック", "ストリーミングデバイス"]
scraper_prompt_ids: ["t001", "t002", "t007", "t011", "t019", "t027", "t033", "t038"]

sampling:
  runs_per_prompt: 1

budget:
  round_usd_max: 15              # AI6面ラウンドの支払上限
  extra_usd_max: 6               # 付帯収集（Amazon/アプリ/YouTube/ニュース/需要）の上限
